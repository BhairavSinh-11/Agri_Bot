services:

# Flask application service
 flask_app:
  
  build: .
  
  container_name: agribot_web
  
  ports:
   - "2423:2423"
  
  volumes:
   - .:/app
  
  env_file:
  - .env
  

#Nginx service


 nginx:

    build: ./nginx

    container_name: agribot_nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./app/static:/app/app/static
      - /etc/letsencrypt:/etc/letsencrypt

    depends_on:
      - flask_app